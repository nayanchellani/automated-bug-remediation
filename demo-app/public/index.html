<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triage Demo Counter</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #000; color: #fff; font-family: system-ui, sans-serif; }
      .counter { text-align: center; border: 1px solid #333; padding: 32px 40px; min-width: 320px; max-width: 420px; }
      .value { font-size: 56px; font-weight: 700; margin: 8px 0 20px; }
      .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
      button { background: #fff; color: #000; border: 1px solid transparent; padding: 8px 16px; cursor: pointer; font-size: 14px; }
      button.outline { background: transparent; color: #fff; border-color: #333; }
      button.danger { background: transparent; color: #f87171; border-color: #7f1d1d; }
      .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #737373; margin: 14px 0 6px; }
      .status { margin-top: 16px; font-size: 13px; min-height: 18px; color: #a3a3a3; word-break: break-word; }
      .status.error { color: #f87171; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React (UMD) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

    <!-- Triage browser SDK: must load before the app so it can catch its errors -->
    <script src="/triage-config.js"></script>
    <script src="/triage-browser.js"></script>
    <script>Triage.init(window.__TRIAGE_CONFIG__)</script>

    <!-- App (JSX compiled on the fly by the demo server) -->
    <script src="/Counter.jsx"></script>
  </body>
</html>
